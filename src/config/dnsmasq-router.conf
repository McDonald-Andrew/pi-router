# Raspberry Pi Proton Router - static dnsmasq policy
# Network-specific values are generated from /etc/proton-router.conf.

# Bind only to configured interfaces and follow address changes
bind-dynamic

# DHCP authority for the LAN
dhcp-authoritative

# Fixed reservations managed by proton-bypass
dhcp-hostsfile=/etc/proton-bypass/devices.conf

# dnsmasq automatically advertises itself as the default router
# and DNS server for directly connected DHCP clients.

# Do not inherit upstream DNS servers from Raspberry Pi OS
no-resolv

# Basic DNS hygiene
domain-needed
bogus-priv

# Disable DNS caching so Cloudflare Families evaluates every lookup.
# This prevents cached CNAME target addresses from bypassing SafeSearch rewrites.
cache-size=0

# Tell compatible browsers that this network manages DNS
address=/use-application-dns.net/
