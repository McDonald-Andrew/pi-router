# Raspberry Pi Router - blocked domain policy
#
# Generic static DNS policy for named bypass services.
# Future web-proxy categories belong in this file.
#
# ============================================================
# TOR PROJECT
# ============================================================
#
# Block Tor Project web properties as an entire DNS namespace.
#
# IMPORTANT:
# onionoo.torproject.org is a required dependency of the
# authoritative Tor public-relay endpoint adapter.
#
# dnsmasq chooses a more-specific domain rule over a less-specific
# domain rule. Therefore Onionoo is explicitly sent to the normal
# configured upstream DNS while the parent namespace returns NXDOMAIN.

server=/onionoo.torproject.org/#
address=/torproject.org/

# ============================================================
# FUTURE WEB-PROXY DOMAIN POLICY
# ============================================================
#
# ============================================================
# CHROME WEB STORE
# ============================================================
#
# Block the Chrome Web Store as an entire DNS namespace.
#
# This is static DNS policy. It is intentionally separate from
# VPN/proxy endpoint adapters and the normalization pipeline.
#

address=/chromewebstore.google.com/

