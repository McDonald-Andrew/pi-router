#!/usr/sbin/nft -f

flush ruleset

# Generated from /etc/proton-router.conf by proton-router-apply-conf.
include "/etc/nftables.d/generated-vars.nft"

table inet router_filter {

    # Devices listed here bypass Proton only for Internet routing.
    # Both MAC and reserved IPv4 address must match.
    set proton_bypass_devices {
        type ether_addr . ipv4_addr
    }

    # Mark bypass devices before the routing decision so policy routing
    # can send them to the raw WAN instead of Proton.
    chain proton_bypass_mark {
        type filter hook prerouting priority mangle;
        policy accept;

        iifname $LAN_IF \
            ether saddr . ip saddr @proton_bypass_devices \
            meta mark set $BYPASS_MARK
    }

    chain input {
        type filter hook input priority filter;
        policy drop;

        # Localhost
        iifname "lo" accept

        # Replies to traffic initiated by this Pi
        ct state established,related accept

        # LAN may access the Pi:
        # DHCP, DNS, SSH, VNC, etc.
        iifname $LAN_IF accept

        # Allow DHCP replies from the WAN/ISP
        iifname $WAN_IF udp sport 67 udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority filter;
        policy drop;

        # Block QUIC / HTTP3, including DoH over HTTP3
        iifname $LAN_IF udp dport 443 reject

        # Block client DNS-over-TLS
        iifname $LAN_IF tcp dport 853 reject

        # Block client DNS-over-QUIC
        iifname $LAN_IF udp dport 853 reject

        # Block common public DoH resolvers over HTTPS
        iifname $LAN_IF \
            ip daddr {
                1.1.1.1, 1.0.0.1,
                1.1.1.3, 1.0.0.3,
                8.8.8.8, 8.8.4.4,
                9.9.9.9, 149.112.112.112
            } tcp dport 443 reject

        # Allow return traffic
        ct state established,related accept

        # Ordinary LAN clients may reach the Internet only through Proton.
        iifname $LAN_IF oifname "proton0" accept

        # Devices marked by proton-bypass may use the raw WAN.
        iifname $LAN_IF oifname $WAN_IF \
            meta mark $BYPASS_MARK accept
    }

    # Permits Proton's encrypted WireGuard transport over the raw WAN.
    chain host_wan_transport {
        # Proton CLI-managed WireGuard
        meta mark 0x0ea13b2c accept comment "PROTON_CLI_WG_TRANSPORT"

        # Emergency manual wg-quick rollback
        meta mark 0x0000ca6c accept comment "PROTON_MANUAL_WG_ROLLBACK"
    }

    # Normally empty. The Proton autoconnect helper temporarily places
    # an accept rule here while Proton performs pre-VPN bootstrap/API/DNS.
    chain host_wan_bootstrap {
    }

    chain output {
        type filter hook output priority filter;
        policy accept;

        # The Pi may obtain/renew its WAN DHCP lease directly.
        oifname $WAN_IF udp sport 68 udp dport 67 accept

        # Permit Proton's currently-active encrypted WireGuard transport.
        oifname $WAN_IF jump host_wan_transport

        # Temporarily opened only while Proton is establishing a tunnel.
        oifname $WAN_IF jump host_wan_bootstrap

        # No ordinary Pi-originated traffic may bypass Proton.
        oifname $WAN_IF drop
    }
}

table ip router_nat {

    chain prerouting {
        type nat hook prerouting priority dstnat;
        policy accept;

        # Force normal client DNS through dnsmasq on this Pi.
        # A client configured for 8.8.8.8:53, for example,
        # will still be redirected to the Pi.
        iifname $LAN_IF udp dport 53 redirect to :53
        iifname $LAN_IF tcp dport 53 redirect to :53
    }

    chain postrouting {
        type nat hook postrouting priority srcnat;
        policy accept;

        # NAT ordinary LAN clients into the Proton tunnel.
        iifname $LAN_IF oifname "proton0" masquerade

        # NAT proton-bypass devices directly onto the ISP/WAN.
        iifname $LAN_IF oifname $WAN_IF \
            meta mark $BYPASS_MARK masquerade
    }
}
