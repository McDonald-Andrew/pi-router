name: Pi Router Release

run-name: Build release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version number without the leading v, for example 1.0.7
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pi-router-release
  cancel-in-progress: false

jobs:
  prepare_release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create draft prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must match X.Y.Z or X.Y.Z-prerelease" >&2
            exit 2
          }

          visibility=$(gh repo view --json visibility --jq .visibility)
          [[ "${visibility,,}" == public ]] || {
            echo "Release-backed Raspberry Pi Imager downloads require a public repository" >&2
            exit 1
          }

          release_tag="v$VERSION"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release already exists: $release_tag" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag already exists: $release_tag" >&2
            exit 1
          fi

          gh release create "$release_tag" \
            --target "$GITHUB_SHA" \
            --title "Pi Router $VERSION release" \
            --notes "Hardware certification is pending. Do not promote this prerelease until the exact Raspberry Pi image passes the required Pi 5 and Waveshare test matrix." \
            --generate-notes \
            --draft \
            --prerelease \
            --latest=false
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

  image:
    needs: prepare_release
    permissions:
      contents: write
    uses: ./.github/workflows/build-image.yml
    with:
      version: ${{ inputs.version }}
      profile: release
      release_tag: ${{ needs.prepare_release.outputs.release_tag }}

  publish:
    needs:
      - prepare_release
      - image
    runs-on: windows-latest

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack router source and build Windows installer
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
              throw 'Version must match X.Y.Z or X.Y.Z-prerelease.'
          }

          $releaseName = "pi-router-v$env:VERSION"
          $tmpDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $archive = Join-Path $tmpDir "$releaseName.tar.gz"
          $sidecar = Join-Path $tmpDir "$releaseName.sha256.txt"
          New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null

          & git archive `
              --format=tar.gz `
              "--prefix=$releaseName/" `
              "--output=$archive" `
              HEAD:src
          if ($LASTEXITCODE -ne 0) {
              throw "git archive exited with code $LASTEXITCODE"
          }

          $archiveSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $sidecar -Value $archiveSha256 -Encoding ascii

          Set-Location $tmpDir
          ..\windows-installer\build.ps1

      - name: Upload existing release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseName = "pi-router-v$env:VERSION"

          gh release upload $env:RELEASE_TAG `
              ".\dist\$releaseName.tar.gz" `
              ".\dist\$releaseName.sha256.txt" `
              .\windows-installer\publish\pi-router-installer.exe `
              .\windows-installer\publish\pi-router-installer.sha256.txt `
              .\windows-installer\publish\THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) {
              throw "release asset upload exited with code $LASTEXITCODE"
          }

      - name: Verify and publish prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseName = "pi-router-v$env:VERSION"
          $imageName = "$releaseName-pi5-arm64"
          $expected = @(
              "$releaseName.tar.gz"
              "$releaseName.sha256.txt"
              'pi-router-installer.exe'
              'pi-router-installer.sha256.txt'
              'THIRD-PARTY-NOTICES.txt'
              "$imageName.img.xz"
              "$imageName.img.xz.sha256"
              "$imageName.manifest.txt"
              "$imageName.rpi-imager-manifest"
          ) | Sort-Object

          $release = gh release view $env:RELEASE_TAG --json assets,isDraft,isPrerelease | ConvertFrom-Json
          if (-not $release.isDraft -or -not $release.isPrerelease) {
              throw 'Release lost its draft prerelease state before publication.'
          }
          $actual = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if (($actual.Count -ne $expected.Count) -or (Compare-Object $expected $actual)) {
              throw "Release asset set mismatch. Expected: $($expected -join ', '); actual: $($actual -join ', ')"
          }

          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) {
              throw "publishing prerelease exited with code $LASTEXITCODE"
          }

          $published = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease | ConvertFrom-Json
          if ($published.isDraft -or -not $published.isPrerelease) {
              throw 'Release was not published as a prerelease.'
          }

  cleanup_failed_draft:
    needs:
      - prepare_release
      - image
      - publish
    if: ${{ always() && needs.prepare_release.result == 'success' && (needs.image.result != 'success' || needs.publish.result != 'success') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Remove incomplete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        run: gh release delete "$RELEASE_TAG" --cleanup-tag --yes
