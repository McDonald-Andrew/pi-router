name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'windows-installer/**'
      - '.github/workflows/build-windows-installer.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained Windows EXE
        shell: powershell
        run: .\build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-router-installer-win-x64
          path: |
            windows-installer/publish/proton-router-installer.exe
            windows-installer/publish/proton-router-installer.sha256.txt
            windows-installer/publish/THIRD-PARTY-NOTICES.txt

      - name: Attach installer to published GitHub release
        if: github.event_name == 'release'
        shell: powershell
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            .\windows-installer\publish\proton-router-installer.exe `
            .\windows-installer\publish\proton-router-installer.sha256.txt `
            .\windows-installer\publish\THIRD-PARTY-NOTICES.txt `
            --clobber
