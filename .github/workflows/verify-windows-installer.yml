name: Verify Windows Installer Release Compiles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "windows-installer/**"
      - ".github/workflows/verify-windows-installer.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile Windows Installer EXE for Release
        shell: powershell
        run: dotnet build .\ProtonRouterInstaller.csproj -c Release
