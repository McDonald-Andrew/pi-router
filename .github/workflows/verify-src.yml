name: Verify Router Source Syntax

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/verify-src.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Shell Syntax
        run: |
          bash -n src/setup src/scripts/proton-router-ip-refresh
          sh -n src/scripts/proton-bypass src/scripts/proton-keyring-init src/scripts/proton-router-apply-conf src/scripts/protonvpn-autoconnect src/scripts/protonvpn-healthcheck

      - name: Check Python Syntax
        run: python3 -m compileall -q src

      - name: Check JavaScript Syntax
        run: node --check src/web/app.js
