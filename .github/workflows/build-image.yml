name: Build Raspberry Pi Image

on:
  workflow_call:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string
      profile:
        description: Image build profile
        required: false
        default: release
        type: string
      release_tag:
        description: Existing draft prerelease that receives the image assets
        required: true
        type: string
    outputs:
      image_name:
        description: Release image name without a file extension
        value: ${{ jobs.build.outputs.image_name }}
      image_sha256:
        description: Compressed image SHA-256
        value: ${{ jobs.build.outputs.image_sha256 }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      image_name: ${{ steps.identity.outputs.image_name }}
      image_sha256: ${{ steps.verify.outputs.image_sha256 }}
    env:
      VERSION: ${{ inputs.version }}
      PROFILE: ${{ inputs.profile }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      OUTPUT_DIR: ${{ github.workspace }}/image-output
      WORK_DIR: ${{ runner.temp }}/pi-router-image-work

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install image-build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends --yes \
            curl \
            fdisk \
            kmod \
            mount \
            python3-jsonschema \
            systemd \
            udev \
            util-linux \
            xz-utils

      - name: Validate release and prepare image identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must match X.Y.Z or X.Y.Z-prerelease" >&2
            exit 2
          }
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || {
            echo "Release tag must exactly match v$VERSION" >&2
            exit 2
          }

          case "$PROFILE" in
            development)
              image_name="pi-router-v${VERSION}-pi5-arm64-development"
              ;;
            release)
              image_name="pi-router-v${VERSION}-pi5-arm64"
              ;;
            *)
              echo "Profile must be development or release" >&2
              exit 2
              ;;
          esac

          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || {
            echo "Image assets may only be added to a draft release" >&2
            exit 1
          }
          [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" == true ]] || {
            echo "Image assets may only be added to a prerelease before hardware certification" >&2
            exit 1
          }

          image_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${image_name}.img.xz"
          {
            printf 'IMAGE_NAME=%s\n' "$image_name"
            printf 'EXPECTED_IMAGE_URL=%s\n' "$image_url"
            printf 'PI_ROUTER_IMAGER_IMAGE_URL=%s\n' "$image_url"
          } >> "$GITHUB_ENV"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"

      - name: Verify image subsystem before building
        run: |
          set -euo pipefail
          sh image/tests/test-contract
          python3 -m compileall -q image
          python3 -m unittest discover -s image/tests -p 'test_*.py'

      - name: Restore verified official image cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pi-router-image-work/base-image-cache
          key: pi-router-base-${{ runner.os }}-${{ hashFiles('image/base-image.env') }}

      - name: Check build host capacity
        run: |
          set -euo pipefail
          mkdir -p -- "$OUTPUT_DIR" "$WORK_DIR"

          minimum_bytes=$((11 * 1024 * 1024 * 1024))
          available_bytes=$(df --output=avail -B1 "$WORK_DIR" | tail -n 1 | tr -d '[:space:]')
          (( available_bytes >= minimum_bytes )) || {
            echo "Image build requires at least 11 GiB free; runner has $available_bytes bytes" >&2
            exit 1
          }

          if [[ ! -c /dev/loop-control ]]; then
            sudo modprobe loop
          fi
          [[ -c /dev/loop-control ]] || {
            echo "GitHub runner does not provide loop-device support" >&2
            exit 1
          }
          sudo losetup --find >/dev/null

      - name: Build and audit image
        run: |
          set -euo pipefail
          bash image/build-local "$VERSION" "$OUTPUT_DIR" "$WORK_DIR" "$PROFILE"

      - name: Verify the four release outputs
        id: verify
        run: |
          set -euo pipefail
          python3 - \
            "$OUTPUT_DIR" \
            "$IMAGE_NAME" \
            "$EXPECTED_IMAGE_URL" \
            "$VERSION" \
            "$PROFILE" \
            "$GITHUB_SHA" \
            "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          import jsonschema

          output_dir = Path(sys.argv[1])
          image_name, expected_url, version, profile, source_commit = sys.argv[2:7]
          github_output = Path(sys.argv[7])
          image = output_dir / f"{image_name}.img.xz"
          sidecar = output_dir / f"{image_name}.img.xz.sha256"
          provenance_path = output_dir / f"{image_name}.manifest.txt"
          imager_path = output_dir / f"{image_name}.rpi-imager-manifest"
          outputs = (image, sidecar, provenance_path, imager_path)
          expected_names = {path.name for path in outputs}
          actual_names = {
              path.name for path in output_dir.iterdir() if not path.name.startswith(".")
          }
          if actual_names != expected_names:
              raise SystemExit(
                  f"unexpected output set: expected {sorted(expected_names)}, got {sorted(actual_names)}"
              )
          for path in outputs:
              if path.is_symlink() or not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"unsafe or empty output: {path.name}")

          digest = hashlib.sha256()
          with image.open("rb") as stream:
              while chunk := stream.read(1024 * 1024):
                  digest.update(chunk)
          image_sha256 = digest.hexdigest()
          image_size = image.stat().st_size
          if sidecar.read_text(encoding="ascii").split() != [image_sha256, image.name]:
              raise SystemExit("image checksum sidecar mismatch")

          provenance = {}
          for line in provenance_path.read_text(encoding="ascii").splitlines():
              key, separator, value = line.partition("=")
              if not separator or not key or key in provenance:
                  raise SystemExit("malformed provenance manifest")
              provenance[key] = value
          expected_status = "development" if profile == "development" else "release"
          checks = {
              "certification_status": expected_status,
              "image_name": image_name,
              "router_version": version,
              "router_source_commit": source_commit.lower(),
              "image_source_commit": source_commit.lower(),
              "compressed_sha256": image_sha256,
              "compressed_size": str(image_size),
          }
          for key, expected in checks.items():
              if provenance.get(key) != expected:
                  raise SystemExit(f"provenance mismatch: {key}")
          if image_size >= int(provenance["github_release_asset_limit_bytes"]):
              raise SystemExit("image exceeds the recorded release asset limit")

          imager = json.loads(imager_path.read_text(encoding="utf-8"))
          schema = json.loads(
              Path("image/imager/os-list-schema.json").read_text(encoding="utf-8")
          )
          jsonschema.Draft7Validator.check_schema(schema)
          jsonschema.Draft7Validator(schema).validate(imager)
          if len(imager["os_list"]) != 1:
              raise SystemExit("Imager manifest must contain one OS entry")
          entry = imager["os_list"][0]
          if entry["url"] != expected_url:
              raise SystemExit("Imager manifest does not point to the release image")
          if entry["image_download_sha256"] != image_sha256:
              raise SystemExit("Imager compressed SHA-256 mismatch")
          if entry["image_download_size"] != image_size:
              raise SystemExit("Imager compressed size mismatch")
          if entry["extract_sha256"] != provenance["image_sha256"]:
              raise SystemExit("Imager extracted SHA-256 mismatch")
          if entry["extract_size"] != int(provenance["image_size"]):
              raise SystemExit("Imager extracted size mismatch")
          if entry["init_format"] != "cloudinit-rpi":
              raise SystemExit("Imager customization format mismatch")
          if entry["devices"] != ["pi5-64bit"]:
              raise SystemExit("Imager device restriction mismatch")
          if "user_required" not in entry["capabilities"]:
              raise SystemExit("Imager manifest does not require OS account setup")

          with github_output.open("a", encoding="utf-8") as stream:
              stream.write(f"image_sha256={image_sha256}\n")
          print(f"verify-build-outputs: PASS: 4 files for {image_name}")
          PY

      - name: Upload image assets directly to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$OUTPUT_DIR/$IMAGE_NAME.img.xz" \
            "$OUTPUT_DIR/$IMAGE_NAME.img.xz.sha256" \
            "$OUTPUT_DIR/$IMAGE_NAME.manifest.txt" \
            "$OUTPUT_DIR/$IMAGE_NAME.rpi-imager-manifest"

      - name: Record image summary
        run: |
          set -euo pipefail
          image="$OUTPUT_DIR/$IMAGE_NAME.img.xz"
          {
            echo "## Raspberry Pi image uploaded"
            echo
            echo "- Profile: \`$PROFILE\`"
            echo "- Version: \`$VERSION\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE_NAME.img.xz\`"
            echo "- Compressed bytes: \`$(stat -c '%s' "$image")\`"
            echo "- SHA-256: \`${{ steps.verify.outputs.image_sha256 }}\`"
            echo "- Destination: prerelease \`$RELEASE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
