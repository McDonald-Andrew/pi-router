# Defaults supplied to the canonical setup config phase on first boot.

ROUTER_USER="admin"
ROUTER_SESSION="rpd-labwc"

# Physical roles are deliberately empty. src/setup detects the Raspberry Pi
# built-in Ethernet and the Waveshare Realtek PCIe Ethernet device.
LAN_IF=""
WAN_IF=""

LAN_ADDR="192.168.50.1"
LAN_PREFIX="24"

DHCP_START="192.168.50.100"
DHCP_END="192.168.50.220"
DHCP_LEASE="12h"

DNS_UPSTREAM="1.1.1.3"

BYPASS_MARK="0x50564250"
BYPASS_TABLE="200"
BYPASS_RULE_PRIORITY="10000"
